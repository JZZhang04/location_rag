[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "location-rag"
version = "0.1.0"
description = "Location intelligence API and MCP integration"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "mcp[cli]>=1.0,<2",
  "pydantic>=2.10,<3",
  "uvicorn>=0.30,<1",
]

[project.scripts]
location-rag-mcp = "mcp_server.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "mcp_server*"]

